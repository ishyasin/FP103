<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — FP10 Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Fira Sans', Arial, sans-serif;min-height:100vh;background:#1b3a6b;color:#1a1a2e;display:flex;flex-direction:column;overflow:hidden}

  /* ── Header (matches index.html) ── */
  header{background:#1b3a6b;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;animation:slideDown 0.5s ease both;position:relative;z-index:20}
  .gdg-text-logo{display:flex;align-items:baseline;gap:6px;line-height:1;white-space:nowrap}
  .gdg-text-logo-main{font-size:17px;font-weight:700;color:#fff;letter-spacing:0.01em}
  .gdg-text-logo-sub{font-size:12px;font-weight:400;color:rgba(255,255,255,0.65);letter-spacing:0.02em}
  .gdg-text-logo-sub sup{font-size:0.7em;color:rgba(255,255,255,0.5)}

  /* ── Hero band with drifting triangles (matches index.html) ── */
  .hero-band{background:#1b3a6b;position:relative;overflow:hidden;padding:40px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}

  @keyframes triRight{
    0%  {transform:translateX(-120vw) scaleY(1)    scaleX(1);   clip-path:polygon(5% 100%,95% 100%,18% 0%)}
    25% {transform:translateX(-60vw)  scaleY(1.3)  scaleX(1.15);clip-path:polygon(3% 100%,92% 100%,32% 0%)}
    50% {transform:translateX(0vw)    scaleY(0.82) scaleX(0.9); clip-path:polygon(7% 100%,97% 100%,22% 0%)}
    75% {transform:translateX(60vw)   scaleY(1.2)  scaleX(1.2); clip-path:polygon(2% 100%,90% 100%,38% 0%)}
    100%{transform:translateX(120vw)  scaleY(1)    scaleX(1);   clip-path:polygon(5% 100%,95% 100%,18% 0%)}
  }
  @keyframes triLeft{
    0%  {transform:translateX(120vw)  scaleY(1)    scaleX(1);   clip-path:polygon(95% 100%,5% 100%,62% 0%)}
    25% {transform:translateX(60vw)   scaleY(0.8)  scaleX(1.25);clip-path:polygon(97% 100%,3% 100%,44% 0%)}
    50% {transform:translateX(0vw)    scaleY(1.35) scaleX(0.82);clip-path:polygon(92% 100%,8% 100%,70% 0%)}
    75% {transform:translateX(-60vw)  scaleY(0.9)  scaleX(1.1); clip-path:polygon(98% 100%,4% 100%,55% 0%)}
    100%{transform:translateX(-120vw) scaleY(1)    scaleX(1);   clip-path:polygon(95% 100%,5% 100%,62% 0%)}
  }
  .tri{position:absolute;bottom:-1px}
  .tri-a{left:-5%;width:50%;height:165px;background:#e8176e;opacity:0.9;transform-origin:bottom left;animation:triRight 180s linear infinite;animation-delay:0s}
  .tri-b{left:-5%;width:50%;height:125px;background:#2a52a0;opacity:0.7;transform-origin:bottom left;animation:triRight 180s linear infinite;animation-delay:-90s}
  .tri-c{right:-5%;width:48%;height:145px;background:#1557a0;opacity:0.8;transform-origin:bottom right;animation:triLeft 216s linear infinite;animation-delay:0s}
  .tri-d{right:-5%;width:36%;height:105px;background:#e8176e;opacity:0.5;transform-origin:bottom right;animation:triLeft 216s linear infinite;animation-delay:-108s}
  .tri-e{left:-5%;width:44%;height:150px;background:#2a52a0;opacity:0.55;transform-origin:bottom left;animation:triRight 180s linear infinite;animation-delay:-60s}
  .tri-f{right:-5%;width:32%;height:118px;background:#1db8a2;opacity:0.4;transform-origin:bottom right;animation:triLeft 216s linear infinite;animation-delay:-72s}

  /* ── Glowing orbs ── */
  .orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:0;animation:orbPulse var(--dur) ease-in-out infinite var(--delay);z-index:1}
  .orb1{width:320px;height:320px;background:rgba(232,23,110,0.18);top:10%;left:15%;--dur:7s;--delay:0s}
  .orb2{width:260px;height:260px;background:rgba(42,82,160,0.22);top:30%;right:10%;--dur:9s;--delay:2s}
  .orb3{width:200px;height:200px;background:rgba(0,180,160,0.15);bottom:20%;left:40%;--dur:11s;--delay:4s}
  .orb4{width:180px;height:180px;background:rgba(232,23,110,0.12);bottom:30%;right:25%;--dur:8s;--delay:1s}
  @keyframes orbPulse{0%{opacity:0;transform:scale(0.9)}40%{opacity:1;transform:scale(1.08)}70%{opacity:0.6;transform:scale(0.95)}100%{opacity:0;transform:scale(0.9)}}

  /* ── Floating particles ── */
  .particle{position:absolute;border-radius:50%;pointer-events:none;z-index:1}
  @keyframes floatUp1{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:0.6}100%{transform:translateY(-100vh) translateX(20px);opacity:0}}
  @keyframes floatUp2{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:0.7}90%{opacity:0.3}100%{transform:translateY(-100vh) translateX(-30px);opacity:0}}
  @keyframes floatUp3{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:0.9}85%{opacity:0.4}100%{transform:translateY(-100vh) translateX(15px);opacity:0}}
  @keyframes bobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

  /* ── Light beams ── */
  .light-beam{position:absolute;top:-20%;width:2px;pointer-events:none;z-index:1;border-radius:2px}
  @keyframes beamFall{0%{transform:translateY(-10%) scaleX(1);opacity:0}15%{opacity:1}85%{opacity:0.6}100%{transform:translateY(120vh) scaleX(1.4);opacity:0}}

  @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  /* ── Login card ── */
  .login-wrap{position:relative;z-index:5;width:100%;max-width:380px;opacity:0;animation:fadeUp 0.6s 0.3s ease both}
  .brand-mark{text-align:center;margin-bottom:22px}
  .brand-mark .name{font-size:22px;font-weight:700;color:#fff;letter-spacing:0.01em}
  .brand-mark .sub{font-size:12px;font-weight:400;color:rgba(255,255,255,0.65);letter-spacing:0.06em;text-transform:uppercase;margin-top:4px}
  .brand-mark sup{font-size:0.6em;color:rgba(255,255,255,0.5);vertical-align:super}

  .card{background:rgba(255,255,255,0.97);backdrop-filter:blur(6px);border-radius:10px;padding:34px 30px 28px;box-shadow:0 20px 60px rgba(0,0,0,0.35);border-top:4px solid #e8176e}
  .card h1{margin:0 0 4px;color:#1b3a6b;font-size:1.3em;font-weight:800}
  .card p.sub{margin:0 0 22px;color:#5a6278;font-size:0.87em;line-height:1.5}
  label{display:block;margin-bottom:5px;font-size:0.82em;font-weight:600;color:#5a6278}
  input{width:100%;padding:11px 12px;margin-bottom:15px;border:1px solid #d0d5dd;border-radius:6px;font-size:0.95em;font-family:'Fira Sans', Arial, sans-serif;transition:border-color 0.15s,box-shadow 0.15s}
  input:focus{outline:none;border-color:#e8176e;box-shadow:0 0 0 3px rgba(232,23,110,0.12)}
  button{width:100%;padding:12px;background:#e8176e;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:0.92em;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;transition:background 0.2s,transform 0.15s}
  button:hover:not(:disabled){background:#c4115c;transform:translateY(-1px)}
  button:disabled{opacity:0.6;cursor:not-allowed;transform:none}
  .error{background:#f8d7da;color:#721c24;padding:10px 12px;border-radius:6px;font-size:0.85em;margin-bottom:14px;display:none}
  .error.show{display:block}
  .footnote{text-align:center;margin-top:18px;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.03em}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <div style="width:4px;height:32px;background:#e8176e;border-radius:2px;flex-shrink:0;"></div>
    <div class="gdg-text-logo">
      <span class="gdg-text-logo-main">GD&amp;G</span><span class="gdg-text-logo-sub">Special Projects<sup>&trade;</sup></span>
    </div>
  </div>
</header>

<div class="hero-band">
  <div class="tri tri-a"></div>
  <div class="tri tri-b"></div>
  <div class="tri tri-c"></div>
  <div class="tri tri-d"></div>
  <div class="tri tri-e"></div>
  <div class="tri tri-f"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="light-beam" style="left:12%;height:60%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.06),transparent);width:3px;animation:beamFall 14s linear infinite;animation-delay:0s"></div>
  <div class="light-beam" style="left:34%;height:75%;background:linear-gradient(to bottom,transparent,rgba(232,23,110,0.08),transparent);width:2px;animation:beamFall 18s linear infinite;animation-delay:-5s"></div>
  <div class="light-beam" style="left:62%;height:55%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.05),transparent);width:4px;animation:beamFall 22s linear infinite;animation-delay:-9s"></div>
  <div class="light-beam" style="left:84%;height:70%;background:linear-gradient(to bottom,transparent,rgba(232,23,110,0.07),transparent);width:2px;animation:beamFall 16s linear infinite;animation-delay:-3s"></div>

  <div class="particle" style="width:4px;height:4px;background:rgba(255,255,255,0.6);bottom:5%;left:8%;animation:floatUp1 12s linear infinite,bobble 4s ease-in-out infinite;animation-delay:0s,0s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(232,23,110,0.8);bottom:5%;left:20%;animation:floatUp2 16s linear infinite,bobble 6s ease-in-out infinite;animation-delay:-4s,-1s"></div>
  <div class="particle" style="width:5px;height:5px;background:rgba(255,255,255,0.4);bottom:5%;left:33%;animation:floatUp3 14s linear infinite,bobble 5s ease-in-out infinite;animation-delay:-8s,-2s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(0,168,142,0.7);bottom:5%;left:45%;animation:floatUp1 18s linear infinite,bobble 7s ease-in-out infinite;animation-delay:-2s,-3s"></div>
  <div class="particle" style="width:4px;height:4px;background:rgba(255,255,255,0.5);bottom:5%;left:57%;animation:floatUp2 13s linear infinite,bobble 4.5s ease-in-out infinite;animation-delay:-6s,-1.5s"></div>
  <div class="particle" style="width:6px;height:6px;background:rgba(232,23,110,0.5);bottom:5%;left:68%;animation:floatUp3 20s linear infinite,bobble 6.5s ease-in-out infinite;animation-delay:-10s,-0.5s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(255,255,255,0.7);bottom:5%;left:76%;animation:floatUp1 15s linear infinite,bobble 5.5s ease-in-out infinite;animation-delay:-3s,-2.5s"></div>
  <div class="particle" style="width:4px;height:4px;background:rgba(0,168,142,0.6);bottom:5%;left:84%;animation:floatUp2 17s linear infinite,bobble 4s ease-in-out infinite;animation-delay:-7s,-1s"></div>
  <div class="particle" style="width:5px;height:5px;background:rgba(232,23,110,0.6);bottom:5%;left:91%;animation:floatUp3 11s linear infinite,bobble 6s ease-in-out infinite;animation-delay:-1s,-3.5s"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(255,255,255,0.45);bottom:5%;left:4%;animation:floatUp1 19s linear infinite,bobble 5s ease-in-out infinite;animation-delay:-5s,-2s"></div>

  <div class="login-wrap">
    <div class="brand-mark">
      <div class="name">FP10<span style="color:#e8176e;"> Manager™</span></div>
      <div class="sub">GD&amp;G Special Projects</div>
    </div>

    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Sign in with your Trust-issued User ID</p>
      <div class="error" id="errorBox"></div>
      <form id="loginForm">
        <label for="userId">User ID</label>
        <input type="text" id="userId" autocomplete="username" autocapitalize="off" spellcheck="false" required />
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" autocomplete="current-password" inputmode="numeric" required />
        <button type="submit" id="submitBtn">Sign in</button>
      </form>
    </div>

    <div class="footnote">Authorised Trust staff only</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/fp10-api.js"></script>
<script>
  // If already signed in, skip straight to the splash page
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const userId = document.getElementById('userId').value.trim();
    const passcode = document.getElementById('passcode').value;

    try {
      const { mustResetPassword } = await signInWithUserId(userId, passcode);
      window.location.href = mustResetPassword ? 'reset-password.html' : 'index.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
