<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Set a new passcode — FP10 Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Fira Sans', Arial, sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1b3a6b;}
  .card{background:#fff;border-radius:10px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.35);border-top:4px solid #e8176e;}
  h1{color:#1b3a6b;font-size:1.3em;margin-bottom:4px;}
  p.sub{color:#5a6278;font-size:0.87em;margin-bottom:22px;line-height:1.5;}
  label{display:block;margin-bottom:5px;font-size:0.82em;font-weight:600;color:#5a6278;}
  input{width:100%;padding:11px 12px;margin-bottom:15px;border:1px solid #d0d5dd;border-radius:6px;font-size:0.95em;}
  input:focus{outline:none;border-color:#e8176e;box-shadow:0 0 0 3px rgba(232,23,110,0.12);}
  button{width:100%;padding:12px;background:#e8176e;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:0.92em;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;}
  button:hover:not(:disabled){background:#c4115c;}
  button:disabled{opacity:0.6;cursor:not-allowed;}
  .error{background:#f8d7da;color:#721c24;padding:10px 12px;border-radius:6px;font-size:0.85em;margin-bottom:14px;display:none;}
  .error.show{display:block;}
</style>
</head>
<body>
  <div class="card">
    <h1>Set a new passcode</h1>
    <p class="sub">This account needs a new passcode before continuing — either it's your first sign-in, or an administrator reset it. Choose one only you know.</p>
    <div class="error" id="errorBox"></div>
    <form id="resetForm">
      <label for="newPass">New passcode (min. 6 characters)</label>
      <input type="password" id="newPass" minlength="6" required autocomplete="new-password" />
      <label for="confirmPass">Confirm new passcode</label>
      <input type="password" id="confirmPass" minlength="6" required autocomplete="new-password" />
      <button type="submit" id="submitBtn">Set passcode</button>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/fp10-api.js"></script>
<script>
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) window.location.href = 'login.html';
})();

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');
  errorBox.classList.remove('show');

  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;

  if (newPass !== confirmPass) {
    errorBox.textContent = "Passcodes don't match.";
    errorBox.classList.add('show');
    return;
  }
  if (newPass.length < 6) {
    errorBox.textContent = 'Passcode must be at least 6 characters.';
    errorBox.classList.add('show');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';
  try {
    await setMyPassword(newPass);
    window.location.href = 'index.html';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Set passcode';
  }
});
</script>
</body>
</html>
